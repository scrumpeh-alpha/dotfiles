# Set prefix (from `Ctrl + b`)
unbind C-b
set -g prefix C-s
unbind r
bind r source-file ~/.tmux.conf     # Bind `r` to reload source file

# Shortcuts for new windows and splits to start in specified paths
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind b new-window -c "#{pane_current_path}" #
bind c new-window #

# Backspace support
bind-key -n C-h send-keys C-w

# Vim motions
bind -r ^ last-window
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
setw -g mode-keys vi

# other
set -s escape-time 0
set -g renumber-windows on
set -g mouse on     # Set mouse support on
# set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-kitty"
set -g focus-events on
set -ga terminal-overrides ",xterm-kitty:Se=\\E[6 q"

# customization
set -g status-style 'bg=#161616 fg=#08adff'
set -g mode-style 'bg=#c4c4c4 fg=#161616'
set -g base-index 1     # Sets window indexing to enumerate from 1
